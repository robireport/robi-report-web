<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Robi Report</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }
    .wrap { max-width: 520px; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 12px; }
    p { color: #a1a1aa; line-height: 1.6; margin: 0 0 20px; }
    a {
      color: #92d2ff;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
  </style>
  <script>
    (function () {
      var loc = window.location;

      function normalizePath(pathname) {
        var path = pathname || '/';
        if (path.length > 1 && path.endsWith('/')) {
          path = path.slice(0, -1);
        }
        return path;
      }

      function redirectTo(target) {
        loc.replace(target + loc.search + loc.hash);
      }

      function tryRedirectMap(redirects) {
        var path = normalizePath(loc.pathname);
        if (redirects[path]) {
          redirectTo(redirects[path]);
          return true;
        }
        if (redirects[path + '.html']) {
          redirectTo(redirects[path + '.html']);
          return true;
        }
        return false;
      }

      function fallbackRedirect() {
        var path = normalizePath(loc.pathname);
        var segment = path.split('/').pop() || '';

        if (segment && segment.indexOf('.') === -1) {
          redirectTo(path + '.html');
          return;
        }

        document.title = 'Page not found — Robi Report';
      }

      fetch('/assets/article-redirects.json', { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) throw new Error('redirect map unavailable');
          return response.json();
        })
        .then(function (redirects) {
          if (!tryRedirectMap(redirects)) {
            fallbackRedirect();
          }
        })
        .catch(function () {
          fallbackRedirect();
        });
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <h1>Page not found</h1>
    <p>That link may be outdated. Try the homepage or search for the story there.</p>
    <p><a href="/">Back to Robi Report</a></p>
  </div>
</body>
</html>
