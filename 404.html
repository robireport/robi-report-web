<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robi Report</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    #not-found {
      display: none;
      max-width: 520px;
      text-align: center;
    }

    html.show-not-found #not-found {
      display: block;
    }

    #not-found h1 {
      font-size: 1.5rem;
      margin: 0 0 12px;
    }

    #not-found p {
      color: #a1a1aa;
      line-height: 1.6;
      margin: 0 0 20px;
    }

    #not-found a {
      color: #92d2ff;
      text-decoration: none;
      font-weight: 600;
    }

    #not-found a:hover {
      text-decoration: underline;
    }
  </style>
  <script>
    (function () {
      var loc = window.location;

      function normalizePath(pathname) {
        var path = pathname || '/';
        if (path.length > 1 && path.endsWith('/')) {
          path = path.slice(0, -1);
        }
        return path;
      }

      function redirectTo(target) {
        loc.replace(target + loc.search + loc.hash);
      }

      function tryRedirectMap(redirects, path) {
        if (redirects[path]) {
          redirectTo(redirects[path]);
          return true;
        }
        if (redirects[path + '.html']) {
          redirectTo(redirects[path + '.html']);
          return true;
        }
        return false;
      }

      function loadRedirects() {
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', '/assets/article-redirects.json', false);
          xhr.send(null);
          if (xhr.status >= 200 && xhr.status < 300) {
            return JSON.parse(xhr.responseText);
          }
        } catch (error) {
          /* fall through */
        }
        return {};
      }

      function showNotFound() {
        document.documentElement.classList.add('show-not-found');
        document.title = 'Page not found — Robi Report';
      }

      function resolve() {
        var path = normalizePath(loc.pathname);
        var redirects = loadRedirects();

        if (tryRedirectMap(redirects, path)) {
          return;
        }

        var segment = path.split('/').pop() || '';
        if (segment && segment.indexOf('.') === -1) {
          redirectTo(path + '.html');
          return;
        }

        showNotFound();
      }

      resolve();
    })();
  </script>
</head>
<body>
  <div id="not-found">
    <h1>Page not found</h1>
    <p>That link may be outdated. Try the homepage or search for the story there.</p>
    <p><a href="/">Back to Robi Report</a></p>
  </div>
</body>
</html>
