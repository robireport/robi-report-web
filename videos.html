<title>Videos — Robi Report</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      params.set('view', 'videos');
      window.location.replace('game.html?' + params.toString());
    })();
  </script>
  <script id="robi-www-redirect">
    (function () {
      if (location.hostname === 'www.robireport.com') {
        location.replace('https://robireport.com' + location.pathname + location.search + location.hash);
      }
    })();
  </script>
  <link rel="canonical" href="https://robireport.com/game.html?view=videos" />
