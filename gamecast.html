<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Robi Report" />
  <link rel="apple-touch-icon" href="/assets/squared-logo-icon-180.png?v=1" />
  <title>Gamecast — Robi Report</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      params.set('view', 'gamecast');
      window.location.replace('game.html?' + params.toString());
    })();
  </script>
  <script id="robi-www-redirect">
    (function () {
      if (location.hostname === 'www.robireport.com') {
        location.replace('https://robireport.com' + location.pathname + location.search + location.hash);
      }
    })();
  </script>
  <link rel="canonical" href="https://robireport.com/game.html?view=gamecast" />
</head>
<body></body>
</html>
